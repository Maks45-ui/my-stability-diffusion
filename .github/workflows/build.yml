name: Build Flow for Windows

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: python -m unittest discover -s tests -v
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --release
      - name: Build Windows installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pnpm tauri build --bundles nsis
      - name: Build signed updater installer
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) { throw "Set the TAURI_SIGNING_PRIVATE_KEY repository secret before publishing a tag." }
          pnpm tauri build --bundles nsis --config src-tauri/tauri.updater.conf.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe.sig -ErrorAction SilentlyContinue)) { throw "Signed updater artifact is missing." }
      - uses: actions/upload-artifact@v4
        with:
          name: Flow-Windows-Installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Flow-Windows-Installer
          path: release
      - name: Publish versioned Windows installer and signed update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          files=(release/*.exe)
          test ${#files[@]} -eq 1
          signature_file="${files[0]}.sig"
          test -s "$signature_file"
          node - "$GITHUB_REF_NAME" "${files[0]}" "$signature_file" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const [tag, installer, signatureFile] = process.argv.slice(2);
          const signature = fs.readFileSync(signatureFile, 'utf8').trim();
          if (!signature) throw new Error('Updater signature is empty');
          const url = 'https://github.com/Maks45-ui/my-stability-diffusion/releases/download/' + tag + '/' + encodeURIComponent(path.basename(installer));
          const manifest = { version: tag, platforms: { 'windows-x86_64': { url, signature } } };
          fs.writeFileSync('release/latest.json', JSON.stringify(manifest, null, 2) + String.fromCharCode(10));
          NODE
          gh release create "$GITHUB_REF_NAME" "${files[0]}" "$signature_file" release/latest.json --generate-notes --title "Flow $GITHUB_REF_NAME"
